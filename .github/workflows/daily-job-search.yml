name: Daily Job Search Digest

on:
  schedule:
    # 7:33 AM Hora de Argentina (UTC-3) -> 10:33 AM UTC
    - cron: '33 10 * * *'
  workflow_dispatch: # Permite ejecutar la búsqueda manualmente desde la web de GitHub

concurrency:
  group: daily-job-search
  cancel-in-progress: false

jobs:
  job-digest:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Para guardar y sincronizar el historial de vacantes vistas
      issues: write   # Para enviar notificación por correo mediante GitHub Issue si SMTP falla

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Optimize network & prefer IPv4 (SMTP reliability)
        run: |
          sudo sysctl -w net.ipv6.conf.all.disable_ipv6=1 || true
          sudo sysctl -w net.ipv6.conf.default.disable_ipv6=1 || true
          sudo sysctl -w net.ipv6.conf.lo.disable_ipv6=1 || true
          if [ -f /etc/gai.conf ]; then
            sudo sed -i 's/^#precedence ::ffff:0:0\/96  100/precedence ::ffff:0:0\/96  100/' /etc/gai.conf || true
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Run Daily Job Digest
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER || 'ebolivar1000@gmail.com' }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python tools/daily_job_digest.py

      - name: Upload Daily HTML Digest Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-job-digest
          path: job_scraper/daily_digest.html
          if-no-files-found: ignore
          retention-days: 14

      - name: Commit updated seen_jobs.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -f job_scraper/seen_jobs.json
          if ! git diff --quiet || ! git diff --staged --quiet; then
            git commit -m "chore(tracker): actualizar historial de vacantes vistas [skip ci]"
            git pull --rebase "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" main
            git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:main
          fi
